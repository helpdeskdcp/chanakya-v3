<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/static/js/lw-charts.js"></script>
</head>
<body style="background:#060d14;color:#fff;font-family:monospace;padding:10px;margin:0">
<div id="status" style="padding:8px;color:#d4af37">Loading...</div>
<div id="c" style="width:100%;height:350px"></div>
<script>
try {
  document.getElementById('status').textContent = 'LW: '+LightweightCharts.version();
  var chart = LightweightCharts.createChart(document.getElementById('c'), {
    width: window.innerWidth,
    height: 350,
    layout:{background:{color:'#060d14'},textColor:'#fff'},
    grid:{vertLines:{color:'#0d1b2a'},horzLines:{color:'#0d1b2a'}},
  });
  var s = chart.addCandlestickSeries({
    upColor:'#00e676',downColor:'#ff5252',
    borderUpColor:'#00e676',borderDownColor:'#ff5252',
    wickUpColor:'#00e676',wickDownColor:'#ff5252'
  });
  s.setData([
    {time:1776657300,open:24337,high:24400,low:24300,close:24383},
    {time:1776657600,open:24383,high:24420,low:24360,close:24357},
    {time:1776657900,open:24357,high:24380,low:24320,close:24343},
    {time:1776658200,open:24343,high:24370,low:24310,close:24365},
    {time:1776658500,open:24365,high:24410,low:24350,close:24395},
  ]);
  chart.timeScale().fitContent();
  document.getElementById('status').textContent = '✅ Chart working! width='+window.innerWidth;
} catch(e) {
  document.getElementById('status').textContent = '❌ Error: '+e.message;
}
</script>
</body>
</html>
