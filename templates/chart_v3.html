<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chanakya AI — Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060d14;color:#e0e8f0;font-family:'Segoe UI',sans-serif;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0a1520;border-bottom:1px solid #1e3a5f;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.logo{color:#d4af37;font-weight:900;font-size:13px;white-space:nowrap}
.sym-btn{padding:4px 10px;border-radius:6px;border:1px solid #1e3a5f;background:transparent;color:#8090a8;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap}
.sym-btn.act{background:#00c8ff;color:#000;border-color:#00c8ff}
.tf-btn{padding:3px 8px;border-radius:4px;border:1px solid #1e3a5f;background:transparent;color:#8090a8;cursor:pointer;font-size:11px}
.tf-btn.act{background:#d4af37;color:#000;border-color:#d4af37}
.ohlc{font-size:10px;color:#8090a8;margin-left:auto;white-space:nowrap}
.ohlc b{color:#fff}
.ltp{font-size:11px;font-weight:700;padding:3px 8px;background:#1e3a5f;border-radius:6px;color:#00c8ff}
.sect-label{font-size:9px;color:#5a6a7a;padding:2px 10px;background:#0a1520}
.strike-row{display:flex;gap:4px;padding:5px 10px;align-items:center;flex-wrap:wrap;background:#0a1520;border-top:1px solid #0d1b2a}
.sk-btn{padding:2px 8px;border-radius:4px;border:1px solid #1e3a5f;background:transparent;color:#8090a8;cursor:pointer;font-size:10px}
.sk-btn.act{background:#d4af37;color:#000;border-color:#d4af37}
.exp{font-size:10px;color:#d4af37;margin-left:4px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#060d14}
.opt-box{background:#0a1520;border:1px solid #1e3a5f;border-radius:8px;overflow:hidden}
.opt-hdr{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#0d1b2a}
.opt-title{font-size:11px;font-weight:800}
.greeks{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;font-size:9px;text-align:center}
.gk{background:#060d14;border-radius:4px;padding:3px 2px}
.gk-l{color:#5a6a7a;font-size:8px;margin-bottom:2px}
.gk-v{font-weight:700;font-size:10px;color:#00c8ff}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">⚡ CHANAKYA</span>
  <div style="display:flex;gap:3px;flex-wrap:wrap">
    <button class="sym-btn act" onclick="setSym('NIFTY',this)">NIFTY</button>
    <button class="sym-btn" onclick="setSym('BANKNIFTY',this)">BN</button>
    <button class="sym-btn" onclick="setSym('FINNIFTY',this)">FIN</button>
    <button class="sym-btn" onclick="setSym('CRUDEOIL',this)">CRUDE</button>
    <button class="sym-btn" onclick="setSym('NATURALGAS',this)">NATGAS</button>
  </div>
  <div style="display:flex;gap:3px">
    <button class="tf-btn" onclick="setTF('ONE_MINUTE',2,this)">1m</button>
    <button class="tf-btn act" onclick="setTF('FIVE_MINUTE',10,this)">5m</button>
    <button class="tf-btn" onclick="setTF('FIFTEEN_MINUTE',20,this)">15m</button>
    <button class="tf-btn" onclick="setTF('THIRTY_MINUTE',30,this)">30m</button>
    <button class="tf-btn" onclick="setTF('ONE_HOUR',60,this)">1h</button>
    <button class="tf-btn" onclick="setTF('ONE_DAY',365,this)">D</button>
  </div>
  <div class="ohlc">O<b id="oO">-</b> H<b id="oH" style="color:#00e676">-</b> L<b id="oL" style="color:#ff5252">-</b> C<b id="oC">-</b></div>
  <div class="ltp" id="ltpBadge">LTP:--</div>
</div>

<!-- MAIN CHART — fixed 300px -->
<div id="mainChart" style="width:100%;height:300px;background:#060d14"></div>

<!-- MACD -->
<div class="sect-label">MACD (12,26,9)</div>
<div id="macdChart" style="width:100%;height:80px;background:#060d14"></div>

<!-- STRIKES -->
<div class="strike-row">
  <span style="font-size:10px;color:#8090a8">Strike:</span>
  <div id="skBtns" style="display:flex;gap:3px;flex-wrap:wrap"></div>
  <span class="exp" id="expLabel"></span>
</div>

<!-- CE / PE -->
<div class="opt-grid">
  <div class="opt-box">
    <div class="opt-hdr">
      <span class="opt-title" style="color:#00e676">📈 CE</span>
      <span style="font-size:10px;color:#00e676" id="ceLTP">₹--</span>
    </div>
    <div id="ceChart" style="width:100%;height:120px;background:#060d14"></div>
    <div class="greeks">
      <div class="gk"><div class="gk-l">IV%</div><div class="gk-v" id="ceIV">-</div></div>
      <div class="gk"><div class="gk-l">Δ Delta</div><div class="gk-v" id="ceDelta">-</div></div>
      <div class="gk"><div class="gk-l">Θ Theta</div><div class="gk-v" id="ceTheta">-</div></div>
      <div class="gk"><div class="gk-l">Γ Gamma</div><div class="gk-v" id="ceGamma">-</div></div>
      <div class="gk"><div class="gk-l">ATR</div><div class="gk-v" id="ceATR">-</div></div>
    </div>
  </div>
  <div class="opt-box">
    <div class="opt-hdr">
      <span class="opt-title" style="color:#ff5252">📉 PE</span>
      <span style="font-size:10px;color:#ff5252" id="peLTP">₹--</span>
    </div>
    <div id="peChart" style="width:100%;height:120px;background:#060d14"></div>
    <div class="greeks">
      <div class="gk"><div class="gk-l">IV%</div><div class="gk-v" id="peIV">-</div></div>
      <div class="gk"><div class="gk-l">Δ Delta</div><div class="gk-v" id="peDelta">-</div></div>
      <div class="gk"><div class="gk-l">Θ Theta</div><div class="gk-v" id="peTheta">-</div></div>
      <div class="gk"><div class="gk-l">Γ Gamma</div><div class="gk-v" id="peGamma">-</div></div>
      <div class="gk"><div class="gk-l">ATR</div><div class="gk-v" id="peATR">-</div></div>
    </div>
  </div>
</div>

<script>
var TOKEN = localStorage.getItem('cv3t') || '';
var API = '/api/v3';
if (!TOKEN) { localStorage.setItem('cv3_redirect','/v3/chart'); window.location.href='/v3'; }

var _sym='NIFTY', _tf='FIVE_MINUTE', _days=10, _strike=0;
var mainChart, mainSeries, vwapLine, macdChart, macdLine, sigLine, histSeries;
var ceChart, ceSeries, peChart, peSeries;
var srLines = [];

var chartOpts = {
  layout: {background:{color:'#060d14'}, textColor:'#8090a8'},
  grid: {vertLines:{color:'#0d1b2a'}, horzLines:{color:'#0d1b2a'}},
  crosshair: {mode:1},
  timeScale: {borderColor:'#1e3a5f', timeVisible:true, secondsVisible:false},
  rightPriceScale: {borderColor:'#1e3a5f'},
  handleScroll: true,
  handleScale: true,
};

function mkChart(id, h) {
  var el = document.getElementById(id);
  el.style.height = h + 'px';
  return LightweightCharts.createChart(el, Object.assign({}, chartOpts, {height: h}));
}

function initCharts() {
  mainChart  = mkChart('mainChart', 300);
  mainSeries = mainChart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff5252',borderUpColor:'#00e676',borderDownColor:'#ff5252',wickUpColor:'#00e676',wickDownColor:'#ff5252'});
  vwapLine   = mainChart.addLineSeries({color:'#d4af37',lineWidth:1,title:'VWAP',lastValueVisible:true});

  mainChart.subscribeCrosshairMove(function(p) {
    if (!p.seriesData) return;
    var d = p.seriesData.get(mainSeries);
    if (!d) return;
    document.getElementById('oO').textContent = d.open.toFixed(1);
    document.getElementById('oH').textContent = d.high.toFixed(1);
    document.getElementById('oL').textContent = d.low.toFixed(1);
    document.getElementById('oC').textContent = d.close.toFixed(1);
  });

  macdChart  = mkChart('macdChart', 80);
  macdLine   = macdChart.addLineSeries({color:'#00c8ff',lineWidth:1});
  sigLine    = macdChart.addLineSeries({color:'#ff9800',lineWidth:1});
  histSeries = macdChart.addHistogramSeries({priceFormat:{type:'price',precision:2}});

  ceChart  = mkChart('ceChart', 120);
  ceSeries = ceChart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff5252',borderUpColor:'#00e676',borderDownColor:'#ff5252',wickUpColor:'#00e676',wickDownColor:'#ff5252'});

  peChart  = mkChart('peChart', 120);
  peSeries = peChart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff5252',borderUpColor:'#00e676',borderDownColor:'#ff5252',wickUpColor:'#00e676',wickDownColor:'#ff5252'});

  mainChart.timeScale().subscribeVisibleLogicalRangeChange(function(r) {
    if (r) macdChart.timeScale().setVisibleLogicalRange(r);
  });
}

async function api(path) {
  try {
    var r = await fetch(API+path, {headers:{'X-Auth-Token':TOKEN}});
    if (r.status===401||r.status===403) { window.location.href='/v3'; return null; }
    return await r.json();
  } catch(e) { console.error(e); return null; }
}

function ema(v, p) {
  if (v.length<p) return v.map(function(){return 0;});
  var k=2/(p+1), e=v.slice(0,p).reduce(function(a,b){return a+b;})/p, r=[e];
  for (var i=p;i<v.length;i++){e=v[i]*k+e*(1-k);r.push(e);}
  return r;
}

function macd(cl) {
  if (cl.length<35) return [];
  var e12=ema(cl,12), e26=ema(cl,26);
  var ml=e12.map(function(v,i){return v-e26[i];});
  var sig=ema(ml.slice(9),9);
  return ml.slice(9).map(function(m,i){return {m:m,s:sig[i],h:m-sig[i]};});
}

function vwap(cs) {
  var ct=0,cv=0;
  return cs.map(function(c){
    var tp=(c.high+c.low+c.close)/3;
    ct+=tp*(c.volume||1); cv+=(c.volume||1);
    return ct/cv;
  });
}

function atr(cs, p) {
  if (cs.length<2) return 0;
  var trs=cs.slice(1).map(function(c,i){
    return Math.max(c.high-c.low,Math.abs(c.high-cs[i].close),Math.abs(c.low-cs[i].close));
  });
  var a=trs.slice(-p);
  return a.length>0?(a.reduce(function(x,y){return x+y;})/a.length).toFixed(1):0;
}

function pivots(cs) {
  if (cs.length<2) return [];
  var p=cs[cs.length-2];
  var PP=(p.high+p.low+p.close)/3;
  return [
    {p:(2*PP-p.low).toFixed(1),  c:'#00e676', t:'R1'},
    {p:PP.toFixed(1),             c:'#d4af37', t:'PP'},
    {p:(2*PP-p.high).toFixed(1), c:'#ff5252', t:'S1'},
  ];
}

async function loadMain() {
  var d = await api('/chart/candles?symbol='+_sym+'&interval='+_tf+'&days='+_days);
  if (!d||!d.success||!d.candles||!d.candles.length) {
    console.log('No data:', d);
    return;
  }
  var cs = d.candles;
  var cd = cs.map(function(c){return {time:c.ts,open:c.open,high:c.high,low:c.low,close:c.close};});
  cd.sort(function(a,b){return a.time-b.time;});

  mainSeries.setData(cd);
  console.log('Set', cd.length, 'candles. First time:', cd[0].time);

  // VWAP
  var vw = vwap(cs);
  var vd = cs.map(function(c,i){return {time:c.ts,value:parseFloat(vw[i].toFixed(2))};});
  vd.sort(function(a,b){return a.time-b.time;});
  vwapLine.setData(vd);

  // MACD
  var cl = cs.map(function(c){return c.close;});
  var mr = macd(cl);
  if (mr.length) {
    var off = cs.length-mr.length;
    macdLine.setData(mr.map(function(m,i){return {time:cs[off+i].ts,value:m.m};}));
    sigLine.setData(mr.map(function(m,i){return {time:cs[off+i].ts,value:m.s};}));
    histSeries.setData(mr.map(function(m,i){return {time:cs[off+i].ts,value:m.h,color:m.h>=0?'#00e676':'#ff5252'};}));
  }

  // S/R
  srLines.forEach(function(s){try{mainChart.removeSeries(s);}catch(e){}});
  srLines=[];
  var t0=cd[0].time, t1=cd[cd.length-1].time;
  pivots(cs).forEach(function(l){
    var s=mainChart.addLineSeries({color:l.c,lineWidth:1,lineStyle:2,title:l.t,lastValueVisible:true,priceLineVisible:false});
    s.setData([{time:t0,value:parseFloat(l.p)},{time:t1,value:parseFloat(l.p)}]);
    srLines.push(s);
  });

  // ATR in CE/PE
  var a = atr(cs, 14);
  document.getElementById('ceATR').textContent = a;
  document.getElementById('peATR').textContent = a;

  mainChart.timeScale().fitContent();
  macdChart.timeScale().fitContent();
}

async function loadStrikes() {
  var d = await api('/chart/strikes?symbol='+_sym);
  if (!d||!d.success) return;
  var atm = d.chain && d.chain.atm ? d.chain.atm : 0;
  var exp = d.chain && d.chain.expiry ? d.chain.expiry : '';
  document.getElementById('expLabel').textContent = exp ? 'Exp:'+exp : '';

  var strikes = [];
  if (d.chain && d.chain.CE) {
    strikes = d.chain.CE.map(function(o){return o.strike;}).sort(function(a,b){return a-b;});
  }

  var btns = document.getElementById('skBtns');
  btns.innerHTML = '';
  _strike = atm;

  strikes.forEach(function(sk) {
    var btn = document.createElement('button');
    btn.className = 'sk-btn' + (sk===atm?' act':'');
    btn.textContent = sk + (sk===atm?' ★':'');
    btn.onclick = function() {
      _strike = sk;
      document.querySelectorAll('.sk-btn').forEach(function(b){b.classList.remove('act');});
      btn.classList.add('act');
      // Update LTP from chain
      if (d.chain) {
        var ce = (d.chain.CE||[]).find(function(o){return o.strike===sk;});
        var pe = (d.chain.PE||[]).find(function(o){return o.strike===sk;});
        if (ce) document.getElementById('ceLTP').textContent = '₹'+(ce.ltp||0).toFixed(1);
        if (pe) document.getElementById('peLTP').textContent = '₹'+(pe.ltp||0).toFixed(1);
      }
    };
    btns.appendChild(btn);
  });

  // Set initial LTP
  if (d.chain) {
    var ce0 = (d.chain.CE||[]).find(function(o){return o.strike===atm;});
    var pe0 = (d.chain.PE||[]).find(function(o){return o.strike===atm;});
    if (ce0) document.getElementById('ceLTP').textContent = '₹'+(ce0.ltp||0).toFixed(1);
    if (pe0) document.getElementById('peLTP').textContent = '₹'+(pe0.ltp||0).toFixed(1);
  }
}

function setSym(s, btn) {
  _sym = s;
  document.querySelectorAll('.sym-btn').forEach(function(b){b.classList.remove('act');});
  btn.classList.add('act');
  loadMain();
  loadStrikes();
}

function setTF(tf, days, btn) {
  _tf = tf; _days = days;
  document.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('act');});
  btn.classList.add('act');
  loadMain();
}

// Live LTP SSE
function startSSE() {
  var src = new EventSource(API+'/stream/ltp?token='+TOKEN);
  src.onmessage = function(e) {
    try {
      var d = JSON.parse(e.data);
      var v = d[_sym];
      if (v) document.getElementById('ltpBadge').textContent = _sym+':₹'+parseFloat(v).toFixed(1);
    } catch(x){}
  };
  src.onerror = function(){ setTimeout(startSSE,5000); };
}

// Init after DOM ready
document.addEventListener('DOMContentLoaded', function() {
  initCharts();
  setTimeout(function(){
    loadMain();
    loadStrikes();
    startSSE();
    setInterval(loadMain, 60000);
  }, 200);
});
</script>
</body>
</html>
